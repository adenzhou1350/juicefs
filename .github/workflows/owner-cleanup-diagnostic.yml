name: Owner cleanup diagnostic

on:
  push:
    branches:
      - codex/trace-pg-cleanup-20261120

permissions:
  contents: read

jobs:
  non-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      MINIO_TEST_BUCKET: 127.0.0.1:9000/testbucket
      MINIO_ACCESS_KEY: testUser
      MINIO_SECRET_KEY: testUserPassword
      GLUSTER_VOLUME: jfstest/gv0
      DISPLAY_PROGRESSBAR: false
      HDFS_ADDR: localhost:8020
      SFTP_HOST: localhost:2222:/home/testUser1/upload/
      SFTP_USER: testUser1
      SFTP_PASS: password
      CIFS_ADDR: localhost:4445/Data
      CIFS_USER: samba
      CIFS_PASSWORD: secret
      WEBDAV_TEST_BUCKET: 127.0.0.1:9007
      TIKV_ADDR: 127.0.0.1
      REDIS_ADDR: redis://127.0.0.1:6379/13
      ETCD_ADDR: 127.0.0.1:3379
      MYSQL_ADDR: (127.0.0.1:3306)/dev
      MYSQL_USER: root
      NFS_ADDR: 127.0.0.1:/srv/nfs/
    steps:
      - name: Require a dedicated GitHub-hosted runner
        env:
          HOSTING_CLASS: ${{ runner.environment }}
        run: test "$HOSTING_CLASS" = github-hosted
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - name: Local coverage directory
        run: mkdir -p cover
      - name: Build
        uses: ./.github/actions/build
      - name: Install packages
        run: |
          sudo .github/scripts/apt_install.sh g++-multilib redis-server libacl1-dev attr glusterfs-server libglusterfs-dev nfs-kernel-server
          sudo mkdir -p /home/travis/.m2/
      - name: Install redis-cluster
        uses: vishnudxb/redis-cluster@1.0.5
        with:
          master1-port: 7000
          master2-port: 7001
          master3-port: 7002
          slave1-port: 7003
          slave2-port: 7004
          slave3-port: 7005
      - name: Prepare databases
        run: TEST=test.meta.non-core ./.github/scripts/prepare_db.sh
      - name: Match original runner cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup
          sudo docker system prune -af
          sudo df -h
      - name: Record actual versions
        run: |
          go version
          sudo go version
          pg_config --version
          psql -d test -Atc 'SELECT version()'
          redis-server --version
          free -m
      - name: Complete non-core test process
        shell: bash
        run: |
          set -o pipefail
          make test.meta.non-core 2>&1 | tee cleanup-meta.log
      - name: Retain diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-diagnostic
          path: cleanup-meta.log
          retention-days: 3
